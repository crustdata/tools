name: competitor-tracker

on:
  push:
    paths: ["competitor-tracker/**", ".github/workflows/competitor-tracker.yml"]
  pull_request:
    paths: ["competitor-tracker/**", ".github/workflows/competitor-tracker.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: competitor-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: competitor-tracker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
