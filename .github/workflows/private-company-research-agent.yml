name: private-company-research-agent

on:
  push:
    paths: ["private-company-research-agent/**", ".github/workflows/private-company-research-agent.yml"]
  pull_request:
    paths: ["private-company-research-agent/**", ".github/workflows/private-company-research-agent.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13", "24"]
    defaults:
      run:
        working-directory: private-company-research-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: private-company-research-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
