name: prospecting-agent

on:
  push:
    paths: ["prospecting-agent/**", ".github/workflows/prospecting-agent.yml"]
  pull_request:
    paths: ["prospecting-agent/**", ".github/workflows/prospecting-agent.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prospecting-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prospecting-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
